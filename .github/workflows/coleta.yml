# Mantém o banco de batalhas do site atualizado: chama a coleta das três regiões a cada 5 minutos.
# A coleta roda no próprio site (api/albion.php?r=coletar); aqui só fazemos a chamada.
name: Coleta de batalhas

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Chamar a coleta
        run: |
          for s in am eu as; do
            curl -s -m 60 "https://seagreen-rat-589164.hostingersite.com/api/albion.php?r=coletar&s=$s" &
            curl -s -m 60 "https://seagreen-rat-589164.hostingersite.com/api/albion.php?r=coletar&s=$s&parte=guildas" &
          done
          wait
          echo
