<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oficina de builds | Empório dos Bots</title>
<link rel="stylesheet" href="/assets/css/theme.css?v=20261016d">
<link rel="stylesheet" href="/assets/css/pages.css?v=20261016d">
<link rel="stylesheet" href="/assets/css/painel.css?v=20261016d">
<link rel="stylesheet" href="/assets/css/habilidades.css?v=20261016d">
<style>
  .ws { display: grid; grid-template-columns: 250px minmax(330px, 440px) 1fr; gap: 16px; align-items: start; }
  .ws-col { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; }
  .ws-list { display: flex; flex-direction: column; min-height: 70vh; }
  .ws-items { flex: 1; overflow-y: auto; margin: 10px 0; display: flex; flex-direction: column; gap: 6px; max-height: 52vh; }
  .ws-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; font-size: 13px; color: var(--text); }
  .ws-item:hover { background: rgba(255,255,255,.04); }
  .ws-item.on { border-color: rgba(226,188,98,.55); background: var(--gold-soft); }
  .ws-item img, .ws-item .ph { width: 30px; height: 30px; border-radius: 6px; background: var(--bg-soft); flex-shrink: 0; }
  .ws-item small { display: block; color: var(--text-dim); font-size: 11px; }
  .ws-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .ws-btns .btn { padding: 8px 6px; font-size: 12.5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags .chip { padding: 5px 10px; font-size: 12px; }
  .lbl { color: var(--text-dim); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 14px 0 8px; }
  .doll { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .slot { aspect-ratio: 1; background: var(--bg-soft); border: 1px solid rgba(255,255,255,.07); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; transition: border-color .15s; }
  .slot:hover { border-color: rgba(226,188,98,.4); }
  .slot.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .slot img { width: 78%; height: 78%; object-fit: contain; }
  .slot .plus { font-size: 22px; color: rgba(255,255,255,.25); }
  .slot .nm { position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; font-size: 9.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
  .slot .sw { position: absolute; top: 5px; right: 6px; font-size: 10px; font-weight: 800; color: #191305; background: var(--gold); border-radius: 5px; padding: 0 5px; }
  .slot.blocked { opacity: .35; cursor: not-allowed; }
  .det { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 16px; }
  .det-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .det-head img { width: 70px; height: 70px; cursor: pointer; border-radius: 10px; background: var(--bg-soft); }
  .det-head b { font-size: 16px; color: var(--text); display: block; }
  .det-head .select { padding: 5px 8px; font-size: 12.5px; }
  .sp-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .sp-pick { width: 42px; height: 42px; border-radius: 50%; border: 2px solid transparent; padding: 2px; background: none; cursor: pointer; opacity: .55; transition: opacity .1s, border-color .1s; }
  .sp-pick img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .sp-pick:hover { opacity: .9; }
  .sp-pick.on { border-color: #6fcf8e; opacity: 1; box-shadow: 0 0 10px rgba(111,207,142,.35); }
  .swaps { border-left: 1px dashed rgba(255,255,255,.12); padding-left: 14px; min-width: 0; }
  .swap { background: var(--bg-soft); border-radius: 10px; padding: 6px; margin-bottom: 8px; font-size: 12px; border: 1px solid transparent; }
  .swap.open { border-color: rgba(226,188,98,.35); }
  .swap-h { display: flex; align-items: center; gap: 8px; }
  .swap-h img { width: 38px; height: 38px; flex-shrink: 0; }
  .swap-h span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600; }
  .swap-h .x { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 4px 6px; }
  .swap-o { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .swap-o .select { padding: 4px 6px; font-size: 12px; }
  .swap-o .sk { background: none; border: 1px solid rgba(255,255,255,.12); color: var(--text-dim); border-radius: 7px; padding: 4px 8px; font-size: 11.5px; cursor: pointer; }
  .swap.open .swap-o .sk { color: var(--gold); border-color: rgba(226,188,98,.45); }
  .swap-sp { display: none; margin-top: 4px; }
  .swap.open .swap-sp { display: block; }
  .swap-sp .lbl { margin: 8px 0 6px; }
  .swap-sp .sp-pick { width: 36px; height: 36px; }
  .swap-add { width: 100%; min-height: 120px; border: 1px dashed rgba(255,255,255,.18); border-radius: 10px; background: none; color: var(--text-dim); font-size: 26px; cursor: pointer; }
  .swap-add:hover { border-color: var(--gold); color: var(--gold); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal.open { display: flex; }
  .modal-box { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; width: 520px; max-width: 100%; max-height: 82vh; display: flex; flex-direction: column; }
  .modal-box header { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 16px 10px; border-bottom: 1px solid var(--card-border); }
  .modal-box header b { display: block; color: var(--text); }
  .pick-list { overflow-y: auto; flex: 1; }
  .pick-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.04); }
  .pick-row:hover { background: var(--gold-soft); }
  .pick-row img { width: 42px; height: 42px; }
  .pick-row b { display: block; color: var(--text); font-size: 14px; }
  .pick-row small { color: var(--text-dim); font-size: 12px; }
  .saved-ind { font-size: 12px; color: var(--text-dim); min-height: 18px; margin-top: 8px; }
  @media (max-width: 1250px) { .ws { grid-template-columns: 230px 1fr; } .ws-right { grid-column: 1 / -1; } }
  @media (max-width: 760px) { .ws { grid-template-columns: 1fr; } .ws-list { min-height: 0; } .det { grid-template-columns: 1fr; } .swaps { border-left: none; padding-left: 0; } }
</style>
</head>
<body>
<div id="topbar-root"></div>
<div class="painel">
  <aside class="painel-side" id="painel-side"></aside>
  <main class="painel-main wide">
    <div class="ws">
      <div class="ws-col ws-list">
        <input class="input" id="flt" placeholder="Buscar nome, notas ou item">
        <div class="ws-items" id="list"></div>
        <div class="ws-btns">
          <button class="btn secondary" id="dup">Duplicar</button>
          <button class="btn secondary" id="del">Remover</button>
          <button class="btn secondary" id="new">+ Nova build</button>
          <button class="btn secondary" id="exp">Exportar</button>
          <label class="btn secondary" style="cursor:pointer">Importar<input type="file" id="imp" accept="application/json" hidden></label>
          <button class="btn secondary" id="share">Copiar link</button>
        </div>
        <button class="btn" id="send-srv" style="margin-top:8px">Enviar pro servidor do Discord</button>
        <div id="send-box" class="small" style="margin-top:6px"></div>
        <a class="btn secondary" href="/painel/builds/" style="margin-top:8px">Voltar para Builds</a>
        <div class="saved-ind" id="saved"></div>
      </div>

      <div class="ws-col" id="center"></div>
      <div class="ws-col ws-right" id="right"></div>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <header><div><b id="m-title">Escolher item</b><small class="muted" id="m-sub"></small></div><button class="btn secondary" id="m-close" style="padding:5px 10px">Fechar</button></header>
    <div style="padding:12px 16px"><input class="input" id="m-q" placeholder="Buscar por nome" style="width:100%"></div>
    <div class="pick-list" id="m-list"></div>
    <div style="padding:10px 16px;border-top:1px solid var(--card-border);text-align:right"><button class="btn secondary" id="m-clear" style="padding:6px 12px">Limpar</button></div>
  </div>
</div>

<script src="/assets/js/config.js?v=20261016d"></script>
<script src="/assets/js/auth.js?v=20261016d"></script>
<script src="/assets/js/common.js?v=20261016d"></script>
<script src="/assets/js/shell.js?v=20261016d"></script>
<script src="/assets/js/painel.js?v=20261020a"></script>
<script src="/assets/js/minhasbuilds.js?v=20261016d"></script>
<script src="/assets/js/habilidades.js?v=20261016d"></script>
<script src="/assets/js/servidor.js?v=20261019c"></script>
<script>
EmporioShell.renderTopbar("/painel/");
EmporioPainel.render("/painel/builds/");

const MB = window.MinhasBuilds;
const $ = function (id) { return document.getElementById(id); };
const KEY_ORDER = ["Q", "W", "E", "R", "D", "F", "A", "P1", "P2", "P3"];
const NO_ENCH = { food: 1, potion: 1, mount: 1 };
let DB = null, CAT = {};      // CAT[slot] = [{p: "2H_ARCANESTAFF", n, sub, tiers:[4..8]}]
let builds = [], cur = null, sel = "mainhand";

// ---------- catálogo ----------
function plainOf(id) { return Emp.plainId(id); }
function tierOfId(id) { const m = /^T(\d)_/.exec(id || ""); return m ? parseInt(m[1], 10) : 8; }
function enchOfId(id) { const m = /@(\d)$/.exec(id || ""); return m ? parseInt(m[1], 10) : 0; }
function makeId(p, t, e) { return "T" + t + "_" + p + (e ? "@" + e : ""); }
function subOf(p, slot) {
  if (slot === "mainhand") return /^2H_/.test(p) ? "Arma de duas mãos" : "Arma de uma mão";
  return { offhand: "Mão secundária", head: "Cabeça", chest: "Peito", shoes: "Sapatos", cape: "Capa", bag: "Bolsa", mount: "Montaria", food: "Comida", potion: "Poção" }[slot] || "";
}
function buildCatalog() {
  const by = {};
  Object.keys(DB.items).forEach(function (id) {
    const it = DB.items[id];
    if (!it.s || id.indexOf("_TOOL_") >= 0) return;
    const p = plainOf(id), t = tierOfId(id);
    const k = it.s + "|" + p;
    if (!by[k]) by[k] = { s: it.s, p: p, tiers: [] };
    by[k].tiers.push(t);
  });
  Object.values(by).forEach(function (x) {
    x.tiers.sort(function (a, b) { return a - b; });
    x.n = Emp.itemBaseName(DB, makeId(x.p, x.tiers[x.tiers.length - 1], 0));
    x.sub = subOf(x.p, x.s);
    (CAT[x.s] = CAT[x.s] || []).push(x);
  });
  Object.values(CAT).forEach(function (l) { l.sort(function (a, b) { return a.n.localeCompare(b.n, "pt-BR"); }); });
}
function entryOf(slot, id) { return (CAT[slot] || []).find(function (x) { return x.p === plainOf(id); }); }
function nameOf(id) { return id ? Emp.itemName(DB, id) : ""; }
function is2H(b) { const m = b.equip.mainhand && b.equip.mainhand.item; return !!m && /^T\d_2H_/.test(m); }

// ---------- salvar ----------
let saveTimer = null;
function touch() {
  clearTimeout(saveTimer);
  $("saved").textContent = "Salvando...";
  saveTimer = setTimeout(function () {
    $("saved").textContent = MB.put(cur) ? "Salvo neste navegador." : "Não foi possível salvar (armazenamento cheio?).";
    builds = MB.list();
    drawList();
  }, 300);
}

// ---------- lista ----------
function drawList() {
  const q = $("flt").value.trim().toLowerCase();
  const shown = builds.filter(function (b) {
    if (!q) return true;
    const hay = [b.nome, b.notas].concat(Object.values(b.equip).map(function (s) { return nameOf(s.item); })).join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  $("list").innerHTML = shown.map(function (b) {
    const w = b.equip.mainhand && b.equip.mainhand.item;
    const r = MB.role(b.papel);
    return '<div class="ws-item' + (cur && b.id === cur.id ? " on" : "") + '" data-id="' + b.id + '">' + (w ? '<img src="' + Emp.icon(w) + '" alt="">' : '<span class="ph"></span>') +
      '<div style="min-width:0"><div>' + Emp.esc(b.nome || "Sem título") + "</div><small>" + (r ? r.n : "Sem função") + "</small></div></div>";
  }).join("") || '<p class="muted small">Nenhuma build.</p>';
}

// ---------- centro: tags, título, equipamento ----------
function drawCenter() {
  const b = cur;
  $("center").innerHTML =
    '<input class="input" id="nome" placeholder="Título da build" maxlength="60" value="' + Emp.esc(b.nome) + '" style="width:100%;font-weight:700;font-size:15px">' +
    '<div class="lbl">Função</div><div class="tags" id="roles">' + MB.ROLES.map(function (r) {
      return '<span class="chip' + (b.papel === r.k ? " on" : "") + '" data-r="' + r.k + '"><span class="dot" style="background:' + r.c + '"></span>' + r.n + "</span>";
    }).join("") + "</div>" +
    '<div class="lbl">Conteúdo</div><div class="tags" id="cont">' + MB.CONTENT.map(function (c) {
      return '<span class="chip' + (b.conteudo.indexOf(c) >= 0 ? " on" : "") + '" data-c="' + c + '">' + c + "</span>";
    }).join("") + "</div>" +
    '<div class="lbl">Equipamento</div><div class="doll">' + MB.SLOTS.map(function (s) {
      const it = b.equip[s.k] && b.equip[s.k].item;
      const blocked = s.k === "offhand" && is2H(b);
      const nsw = (b.equip[s.k] && b.equip[s.k].swaps || []).length;
      const pos = s.k === "mount" ? ' style="grid-column:2"' : "";
      return '<div class="slot' + (sel === s.k ? " on" : "") + (blocked ? " blocked" : "") + '" data-s="' + s.k + '"' + pos + ' title="' + Emp.esc(it ? nameOf(it) : s.n) + '">' +
        (it ? '<img src="' + Emp.icon(it) + '" alt="">' : '<span class="plus">+</span>') + (nsw ? '<span class="sw">+' + nsw + "</span>" : "") + '<span class="nm">' + s.n + "</span></div>";
    }).join("") + "</div>" +
    '<div class="lbl">Descrição</div><textarea class="input" id="notas" rows="4" placeholder="Notas para a sua guilda" style="width:100%">' + Emp.esc(b.notas) + "</textarea>";
}

// ---------- direita: detalhes do item e swaps ----------
function drawRight() {
  const b = cur, slotDef = MB.SLOTS.find(function (s) { return s.k === sel; });
  const st = b.equip[sel];
  const id = st && st.item;
  if (sel === "offhand" && is2H(b)) {
    $("right").innerHTML = '<div class="lbl" style="margin-top:0">Detalhes do item</div><p class="muted">A arma da mão principal é de duas mãos, então a mão secundária fica vazia.</p>';
    return;
  }
  if (!id) {
    $("right").innerHTML = '<div class="lbl" style="margin-top:0">Detalhes do item</div><p class="muted">' + slotDef.n + ' vazio.</p><button class="btn" id="pick-main">Escolher item</button>';
    return;
  }
  const e = entryOf(slotDef.s, id) || { tiers: [tierOfId(id)] };
  const t = tierOfId(id), en = enchOfId(id);
  const base = "T" + t + "_" + plainOf(id);
  const g = (DB.items[base] || {}).g || {};
  const keys = Object.keys(g).sort(function (a, c) { return KEY_ORDER.indexOf(a) - KEY_ORDER.indexOf(c); });
  const chosen = (b.sp[sel] = b.sp[sel] || {});
  const swaps = st.swaps || [];
  $("right").innerHTML =
    '<div class="det"><div><div class="lbl" style="margin-top:0">Detalhes do item</div>' +
    '<div class="det-head"><img src="' + Emp.icon(id) + '" alt="" id="pick-main" title="Trocar item"><div><b>' + Emp.esc(Emp.itemBaseName(DB, id)) + '</b><div class="row" style="gap:6px;margin-top:6px">' +
    '<select class="select" id="tier">' + e.tiers.map(function (x) { return '<option value="' + x + '"' + (x === t ? " selected" : "") + ">T" + x + "</option>"; }).join("") + "</select>" +
    (NO_ENCH[slotDef.s] ? "" : '<select class="select" id="ench">' + [0, 1, 2, 3, 4].map(function (x) { return '<option value="' + x + '"' + (x === en ? " selected" : "") + ">" + (x ? "." + x : "Sem encanto") + "</option>"; }).join("") + "</select>") +
    '<button class="btn secondary" id="rm-main" style="padding:5px 10px;font-size:12px">Remover</button></div></div></div>' +
    (keys.length ? keys.map(function (k) {
      if (!chosen[k] || g[k].indexOf(chosen[k]) < 0) chosen[k] = g[k][0];
      return '<div class="lbl">' + (/^P/.test(k) ? "Passivas" : "Slot " + k) + '</div><div class="sp-row">' + g[k].map(function (sid) {
        return '<button class="sp-pick' + (chosen[k] === sid ? " on" : "") + '" data-sp="' + sid + '" data-k="' + k + '" data-sp-click data-pick="' + k + '"><img src="' + Emp.spellIcon(sid) + '" alt=""></button>';
      }).join("") + "</div>";
    }).join("") : '<p class="muted small" style="margin-top:12px">Esse item não tem habilidades para escolher.</p>') +
    '</div><div class="swaps"><div class="lbl" style="margin-top:0">Swaps</div>' +
    swaps.map(function (w, i) { return swapHtml(slotDef, w, i); }).join("") +
    '<button class="swap-add" id="add-swap" title="Adicionar swap">+</button></div></div>';
  prefetch(slotDef.s, id);
  swaps.forEach(function (w) { prefetch(slotDef.s, w); });
}

// Um swap: item com tier, encantamento e as habilidades escolhidas para ele.
let openSwap = {};
function swapSpells(w) {
  cur.spw = cur.spw || {};
  cur.spw[sel] = cur.spw[sel] || {};
  const p = plainOf(w);
  return (cur.spw[sel][p] = cur.spw[sel][p] || {});
}
function swapHtml(slotDef, w, i) {
  const e = entryOf(slotDef.s, w) || { tiers: [tierOfId(w)] };
  const t = tierOfId(w), en = enchOfId(w);
  const g = (DB.items["T" + t + "_" + plainOf(w)] || {}).g || {};
  const keys = Object.keys(g).sort(function (a, c) { return KEY_ORDER.indexOf(a) - KEY_ORDER.indexOf(c); });
  const chosen = swapSpells(w);
  const isOpen = openSwap[sel + ":" + i];
  return '<div class="swap' + (isOpen ? " open" : "") + '"><div class="swap-h"><img src="' + Emp.icon(w) + '" alt=""><span title="' + Emp.esc(nameOf(w)) + '">' + Emp.esc(Emp.itemBaseName(DB, w)) + '</span><button class="x" data-rmswap="' + i + '" title="Remover">✕</button></div>' +
    '<div class="swap-o"><select class="select" data-swt="' + i + '">' + e.tiers.map(function (x) { return '<option value="' + x + '"' + (x === t ? " selected" : "") + ">T" + x + "</option>"; }).join("") + "</select>" +
    (NO_ENCH[slotDef.s] ? "" : '<select class="select" data-swe="' + i + '">' + [0, 1, 2, 3, 4].map(function (x) { return '<option value="' + x + '"' + (x === en ? " selected" : "") + ">" + (x ? "." + x : "Sem encanto") + "</option>"; }).join("") + "</select>") +
    (keys.length ? '<button class="sk" data-swopen="' + i + '">' + (isOpen ? "Fechar" : "Habilidades") + "</button>" : "") + "</div>" +
    (keys.length ? '<div class="swap-sp">' + keys.map(function (k) {
      if (!chosen[k] || g[k].indexOf(chosen[k]) < 0) chosen[k] = g[k][0];
      return '<div class="lbl">' + (/^P/.test(k) ? "Passivas" : "Slot " + k) + '</div><div class="sp-row">' + g[k].map(function (sid) {
        return '<button class="sp-pick' + (chosen[k] === sid ? " on" : "") + '" data-sp="' + sid + '" data-k="' + k + '" data-sp-click data-swpick="' + k + '" data-swi="' + i + '"><img src="' + Emp.spellIcon(sid) + '" alt=""></button>';
      }).join("") + "</div>";
    }).join("") + "</div>" : "") + "</div>";
}

// Carrega em segundo plano todas as variações de tier e encanto do item, para a troca ser imediata.
const prefetched = {};
function prefetch(slotS, id) {
  const e = entryOf(slotS, id);
  if (!e) return;
  const p = plainOf(id);
  e.tiers.forEach(function (t) {
    (NO_ENCH[slotS] || t < 4 ? [0] : [0, 1, 2, 3, 4]).forEach(function (en) {
      const v = makeId(p, t, en);
      if (prefetched[v]) return;
      prefetched[v] = 1;
      const im = new Image(); im.decoding = "async"; im.src = Emp.icon(v);
    });
  });
}

function drawAll() { drawList(); drawCenter(); drawRight(); }

// ---------- seletor de itens ----------
let pickCb = null, pickSlot = null;
function openPicker(slotKey, title, cb, onClear) {
  const def = MB.SLOTS.find(function (s) { return s.k === slotKey; });
  pickSlot = def.s; pickCb = cb;
  $("m-title").textContent = title;
  $("m-sub").textContent = def.n;
  $("m-q").value = "";
  $("m-clear").style.display = onClear ? "" : "none";
  $("m-clear").onclick = function () { closePicker(); if (onClear) onClear(); };
  drawPicker();
  $("modal").classList.add("open");
  setTimeout(function () { $("m-q").focus(); }, 30);
}
function closePicker() { $("modal").classList.remove("open"); }
function drawPicker() {
  const q = $("m-q").value.trim().toLowerCase();
  const list = (CAT[pickSlot] || []).filter(function (x) { return !q || x.n.toLowerCase().indexOf(q) >= 0; }).slice(0, 300);
  $("m-list").innerHTML = list.map(function (x) {
    const t = x.tiers[x.tiers.length - 1];
    return '<div class="pick-row" data-p="' + x.p + '"><img src="' + Emp.icon(makeId(x.p, t, 0)) + '" alt="" loading="lazy"><div><b>' + Emp.esc(x.n) + "</b><small>" + Emp.esc(x.sub) + "</small></div></div>";
  }).join("") || '<p class="muted" style="padding:16px">Nenhum item com esse nome.</p>';
}
$("m-q").addEventListener("input", drawPicker);
$("m-close").onclick = closePicker;
$("modal").addEventListener("click", function (e) { if (e.target.id === "modal") closePicker(); });
$("m-list").addEventListener("click", function (e) {
  const r = e.target.closest("[data-p]");
  if (!r) return;
  const x = (CAT[pickSlot] || []).find(function (y) { return y.p === r.dataset.p; });
  closePicker();
  if (x && pickCb) pickCb(x);
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePicker(); });

// Mesmo tier/encanto do item atual quando existir; senão o maior tier do item.
function idFor(x, ref) {
  let t = ref ? tierOfId(ref) : 8;
  if (x.tiers.indexOf(t) < 0) t = x.tiers[x.tiers.length - 1];
  const e = ref && !NO_ENCH[x.s] ? enchOfId(ref) : 0;
  return makeId(x.p, t, e);
}

// ---------- eventos ----------
$("center").addEventListener("input", function (e) {
  if (e.target.id === "nome") { cur.nome = e.target.value; touch(); }
  if (e.target.id === "notas") { cur.notas = e.target.value; touch(); }
});
$("center").addEventListener("click", function (e) {
  const r = e.target.closest("[data-r]");
  if (r) { cur.papel = cur.papel === r.dataset.r ? "" : r.dataset.r; touch(); drawCenter(); return; }
  const c = e.target.closest("[data-c]");
  if (c) {
    const i = cur.conteudo.indexOf(c.dataset.c);
    if (i >= 0) cur.conteudo.splice(i, 1); else cur.conteudo.push(c.dataset.c);
    touch(); drawCenter(); return;
  }
  const s = e.target.closest("[data-s]");
  if (s) {
    if (s.classList.contains("blocked")) { sel = "offhand"; drawCenter(); drawRight(); return; }
    sel = s.dataset.s;
    drawCenter(); drawRight();
    if (!(cur.equip[sel] && cur.equip[sel].item)) $("pick-main") && $("pick-main").click();
  }
});
$("right").addEventListener("click", function (e) {
  const t = e.target;
  if (t.closest("#pick-main")) {
    const def = MB.SLOTS.find(function (s) { return s.k === sel; });
    openPicker(sel, "Escolher item", function (x) {
      const old = cur.equip[sel] && cur.equip[sel].item;
      cur.equip[sel] = { item: idFor(x, old), swaps: (cur.equip[sel] && cur.equip[sel].swaps) || [] };
      cur.sp[sel] = {};
      if (sel === "mainhand" && is2H(cur)) delete cur.equip.offhand;
      touch(); drawCenter(); drawRight();
    }, cur.equip[sel] && cur.equip[sel].item ? function () { delete cur.equip[sel]; delete cur.sp[sel]; touch(); drawCenter(); drawRight(); } : null);
    return;
  }
  if (t.closest("#rm-main")) { delete cur.equip[sel]; delete cur.sp[sel]; touch(); drawCenter(); drawRight(); return; }
  if (t.closest("#add-swap")) {
    openPicker(sel, "Escolher swap", function (x) {
      const st = cur.equip[sel];
      st.swaps = st.swaps || [];
      st.swaps.push(idFor(x, st.item));
      touch(); drawCenter(); drawRight();
    }, null);
    return;
  }
  const rs = t.closest("[data-rmswap]");
  if (rs) {
    const w = cur.equip[sel].swaps.splice(parseInt(rs.dataset.rmswap, 10), 1)[0];
    // Habilidades do swap removido saem junto, se não houver outro swap do mesmo item.
    if (cur.spw && cur.spw[sel] && !cur.equip[sel].swaps.some(function (x) { return plainOf(x) === plainOf(w); })) delete cur.spw[sel][plainOf(w)];
    openSwap = {};
    touch(); drawCenter(); drawRight(); return;
  }
  const so = t.closest("[data-swopen]");
  if (so) { const k = sel + ":" + so.dataset.swopen; openSwap[k] = !openSwap[k]; drawRight(); return; }
  const swp = t.closest("[data-swpick]");
  if (swp) {
    const w = cur.equip[sel].swaps[parseInt(swp.dataset.swi, 10)];
    swapSpells(w)[swp.dataset.swpick] = swp.dataset.sp;
    touch();
    swp.parentElement.querySelectorAll(".sp-pick").forEach(function (x) { x.classList.toggle("on", x === swp); });
    return;
  }
  const sp = t.closest("[data-pick]");
  if (sp) {
    cur.sp[sel][sp.dataset.pick] = sp.dataset.sp;
    touch();
    sp.parentElement.querySelectorAll(".sp-pick").forEach(function (x) { x.classList.toggle("on", x === sp); });
  }
});
$("right").addEventListener("change", function (e) {
  const st = cur.equip[sel];
  if (!st) return;
  const p = plainOf(st.item);
  const d = e.target.dataset;
  if (e.target.id === "tier") st.item = makeId(p, parseInt(e.target.value, 10), enchOfId(st.item));
  if (e.target.id === "ench") st.item = makeId(p, tierOfId(st.item), parseInt(e.target.value, 10));
  // Cada swap tem o próprio tier e encanto.
  if (d.swt != null) { const i = +d.swt, w = st.swaps[i]; st.swaps[i] = makeId(plainOf(w), parseInt(e.target.value, 10), enchOfId(w)); }
  if (d.swe != null) { const i = +d.swe, w = st.swaps[i]; st.swaps[i] = makeId(plainOf(w), tierOfId(w), parseInt(e.target.value, 10)); }
  touch(); drawCenter(); drawRight();
});

$("list").addEventListener("click", function (e) {
  const it = e.target.closest("[data-id]");
  if (!it) return;
  cur = MB.get(it.dataset.id);
  cur.spw = cur.spw || {}; openSwap = {};
  history.replaceState(null, "", "?id=" + cur.id);
  drawAll();
});
$("flt").addEventListener("input", drawList);
$("new").onclick = function () { cur = MB.blank(); sel = "mainhand"; MB.put(cur); builds = MB.list(); history.replaceState(null, "", "?id=" + cur.id); drawAll(); };
$("dup").onclick = function () {
  const c = JSON.parse(JSON.stringify(cur));
  c.id = MB.blank().id; c.nome = (cur.nome || "Sem título") + " (cópia)";
  MB.put(c); builds = MB.list(); cur = c; history.replaceState(null, "", "?id=" + cur.id); drawAll();
};
$("del").onclick = function () {
  if (!confirm("Remover \"" + (cur.nome || "Sem título") + "\" deste navegador?")) return;
  MB.remove(cur.id); builds = MB.list();
  cur = builds[0] || MB.blank();
  if (!builds.length) MB.put(cur), builds = MB.list();
  history.replaceState(null, "", "?id=" + cur.id); drawAll();
};
$("exp").onclick = function () {
  const blob = new Blob([JSON.stringify({ tipo: "emporio-builds", versao: 1, builds: MB.list() }, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "minhas-builds.json"; a.click();
};
$("imp").onchange = function () {
  const f = this.files[0]; if (!f) return;
  f.text().then(function (txt) {
    const d = JSON.parse(txt);
    const arr = Array.isArray(d) ? d : d.builds || [];
    const all = MB.list();
    arr.forEach(function (b) { if (b && b.equip) { b.id = MB.blank().id; b.sp = b.sp || {}; b.conteudo = b.conteudo || []; all.unshift(b); } });
    MB.saveAll(all); builds = MB.list(); cur = builds[0]; drawAll();
    $("saved").textContent = arr.length + " build(s) importada(s).";
  }).catch(function () { $("saved").textContent = "Arquivo inválido."; });
  this.value = "";
};
$("share").onclick = function () {
  const url = MB.shareUrl(cur);
  navigator.clipboard.writeText(url).then(function () { $("saved").textContent = "Link copiado. Quem abrir vê a build completa."; }, function () { prompt("Copie o link:", url); });
};

// ---------- início ----------
Emp.items().then(function (d) {
  DB = d;
  buildCatalog();
  builds = MB.list();
  const qs = new URLSearchParams(location.search);
  if (qs.get("new") || !builds.length) { cur = MB.blank(); MB.put(cur); builds = MB.list(); history.replaceState(null, "", "?id=" + cur.id); }
  else cur = (qs.get("id") && MB.get(qs.get("id"))) || builds[0];
  cur.sp = cur.sp || {}; cur.spw = cur.spw || {}; cur.conteudo = cur.conteudo || []; cur.equip = cur.equip || {};
  drawAll();
});

// ---------- enviar pro servidor (biblioteca do bot) ----------
async function enviarServidor(gid, gname) {
  const box = $("send-box");
  box.textContent = "Enviando pro " + gname + "...";
  try {
    const r = await EmpServidor.post(gid, "/api/servidor/builds", { id: cur.srv && cur.srv.g === gid ? cur.srv.id : "", nome: cur.nome || "Sem título", papel: cur.papel || "", equip: cur.equip || {}, notas: cur.notas || "" });
    cur.srv = { g: gid, gn: gname, id: r.build.id };
    MB.put(cur);
    box.innerHTML = "Salvo no bot do " + Emp.esc(gname) + ". Já dá pra ligar essa build numa vaga da composição.";
  } catch (e) { box.textContent = e.message; }
}
$("send-srv").onclick = async function () {
  const box = $("send-box");
  if (!window.EmporioAuth.getToken()) { box.innerHTML = '<a href="' + window.EmporioAuth.loginUrl() + '">Entre com o Discord</a> pra mandar a build pro bot.'; return; }
  if (cur.srv) return enviarServidor(cur.srv.g, cur.srv.gn || "servidor");
  const gs = await EmpServidor.lista();
  if (!gs.length) { box.innerHTML = 'Nenhum servidor seu tem o bot. <a href="' + EmpServidor.INVITE + '" target="_blank" rel="noopener">Adicionar o bot</a>.'; return; }
  if (gs.length === 1) return enviarServidor(gs[0].id, gs[0].name);
  box.innerHTML = '<div class="row wrap" style="gap:6px"><select class="select" id="send-g">' + gs.map(function (g) { return '<option value="' + g.id + '">' + Emp.esc(g.name) + "</option>"; }).join("") + '</select><button class="btn secondary" id="send-ok" style="padding:6px 12px">Enviar</button></div>';
  $("send-ok").onclick = function () { const g = gs.find(function (x) { return x.id === $("send-g").value; }); enviarServidor(g.id, g.name); };
};
</script>
