<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guildas | Empório dos Bots</title>
<link rel="stylesheet" href="/assets/css/theme.css?v=20261015f">
<link rel="stylesheet" href="/assets/css/pages.css?v=20261015f">
<link rel="stylesheet" href="/assets/css/painel.css?v=20261015f">

</head>
<body>
<div id="topbar-root"></div>
<div class="painel">
  <aside class="painel-side" id="painel-side"></aside>
  <main class="painel-main">

    <div class="painel-head"><div><h1>Guildas</h1><p class="subtitle" style="margin:0">A guilda do jogo que você acompanha e as guildas do Discord ligadas à sua conta.</p></div></div>
    <div id="notice"></div>
    <div id="gbar"></div>
    <div id="ov"></div>
    <div class="section"><div class="card" id="discord"><div class="state"><span class="spin"></span>Verificando login...</div></div></div>
  </main>
</div>
<script src="/assets/js/config.js?v=20261015f"></script>
<script src="/assets/js/auth.js?v=20261015f"></script>
<script src="/assets/js/common.js?v=20261015f"></script>
<script src="/assets/js/shell.js?v=20261015f"></script>
<script src="/assets/js/painel.js?v=20261015f"></script>
<script src="/assets/js/minhasbuilds.js?v=20261015f"></script>
<script>
EmporioShell.renderTopbar("/painel/");
EmporioPainel.render("/painel/guildas/");
const P = window.EmporioPainel;
const $ = function (id) { return document.getElementById(id); };

if (new URLSearchParams(location.search).get("erro") === "painel_legado_expirado") {
  $("notice").innerHTML = '<div class="card" style="margin-bottom:18px;border-color:rgba(226,188,98,.4)"><b>O painel antigo foi desativado.</b><p class="muted small" style="margin:6px 0 0">O endereço que você abriu era do painel anterior. As páginas novas ficam aqui.</p></div>';
}
P.guildBar($("gbar"), async function (G) {
  if (!G) { $("ov").innerHTML = '<div class="card"><h2>Escolha a sua guilda</h2><p class="muted">Busque a guilda pelo nome na barra acima. Ela fica ligada ao painel e é usada em Membros, Batalhas, Regears, Saldo e Presença.</p></div>'; return; }
  $("ov").innerHTML = Emp.loading("Buscando " + G.n + "...");
  try {
    const r = await Promise.all([Emp.albion("guild", { s: G.s, id: G.id }), Emp.albion("members", { s: G.s, id: G.id }), P.guildBattles(G, 1).catch(function () { return []; })]);
    const d = r[0], mem = r[1], bt = r[2];
    const top = mem.slice().sort(function (a, b) { return b.kf - a.kf; }).slice(0, 8);
    let k = 0, dd = 0, f = 0;
    bt.forEach(function (b) { const s = P.guildSide(b, G.id); k += s.k; dd += s.d; f += s.f; });
    $("ov").innerHTML =
      '<div class="card"><div class="row between wrap"><div><h2 style="margin:0">' + Emp.esc(d.Name) + '</h2><span class="muted small">' + (d.AllianceTag ? "Aliança [" + Emp.esc(d.AllianceTag) + "] · " : "") + "Fundada por " + Emp.esc(d.FounderName || "?") + (d.Founded ? " em " + new Date(d.Founded).toLocaleDateString("pt-BR") : "") + "</span></div></div>" +
      '<div class="stats" style="margin-top:14px"><div class="stat"><b>' + (d.MemberCount || mem.length) + '</b><span>Membros</span></div><div class="stat"><b>' + Emp.num(d.killFame) + '</b><span>Fama de abate total</span></div><div class="stat"><b>' + Emp.num(d.DeathFame) + '</b><span>Fama de morte total</span></div>' +
      '<div class="stat"><b>' + bt.length + '</b><span>Batalhas recentes</span></div><div class="stat"><b>' + k + " / " + dd + '</b><span>Abates e mortes nelas</span></div></div></div>' +
      '<div class="grid2 section"><div class="card"><h2>Maiores matadores</h2>' + top.map(function (m, i) {
        return '<div class="row between" style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)"><span><span class="muted small">' + (i + 1) + ".</span> <b>" + Emp.esc(m.n) + '</b></span><span class="muted">' + Emp.num(m.kf) + "</span></div>";
      }).join("") + '<a class="small" href="/painel/guildas/membros/">Ver todos os membros</a></div>' +
      '<div class="card"><h2>Atalhos da guilda</h2><div class="feature-grid" style="grid-template-columns:1fr 1fr">' +
      [["/painel/guildas/batalhas/", "Batalhas", "Lutas recentes e resultado"], ["/painel/guildas/regears/", "Regears", "Quem morreu e quanto repor"], ["/painel/guildas/saldo/", "Saldo", "Loot split e saldo de cada membro"], ["/painel/presenca/", "Presença", "Quem apareceu nas batalhas"]].map(function (x) {
        return '<a class="feature-card" href="' + x[0] + '" style="padding:14px"><h3 style="font-size:15px">' + x[1] + "</h3><p>" + x[2] + "</p></a>";
      }).join("") + "</div></div></div>";
  } catch (e) { $("ov").innerHTML = Emp.emptyState(Emp.esc(e.message) + ". Tente de novo em alguns minutos."); }
});
window.EmporioAuth.me().then(function (u) {
  if (!u) { $("discord").innerHTML = '<h2>Guildas do Discord</h2><p class="muted">Entre com o Discord para ver as guildas ligadas à sua conta pelo bot.</p><a class="btn" href="' + window.EmporioAuth.loginUrl() + '">Entrar com Discord</a>'; return; }
  const gs = Array.isArray(u.guilds) ? u.guilds : [];
  $("discord").innerHTML = '<h2>Guildas do Discord</h2>' + (gs.length ? gs.map(function (g) { return '<div class="row" style="padding:6px 0"><b>' + Emp.esc(g.name || g.nome || g.id) + "</b></div>"; }).join("") : '<p class="muted">Nenhum servidor do Discord com o bot ligado à sua conta ainda.</p>');
});

</script>
</body>
</html>
