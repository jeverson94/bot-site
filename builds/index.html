<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds | Empório dos Bots</title>
<meta name="description" content="Builds de Albion Online compartilhadas pelos membros das guildas que usam o Empório.">
<link rel="stylesheet" href="/assets/css/theme.css">
<style>
  .builds-head { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:20px; margin-bottom:26px; }
  .builds-head h1 { font-size:28px; margin:0 0 6px; }
  .search-box {
    background: var(--bg-soft); border:1px solid rgba(255,255,255,.08); border-radius:10px;
    padding: 11px 16px; color: var(--text); font-size:14px; width: 280px; max-width: 100%;
  }
  .search-box:focus { outline:none; border-color:var(--gold); }
  .filters-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px; }
  .filter-pill {
    background: var(--card); border:1px solid var(--card-border); color: var(--text-dim);
    font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer;
    transition: all .12s ease; user-select:none;
  }
  .filter-pill:hover { border-color: rgba(226,188,98,.4); color: var(--text); }
  .filter-pill.active { background: var(--gold-soft); border-color: rgba(226,188,98,.5); color: var(--gold); }
  .filter-group { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .filter-group-label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim); margin-right:4px; }

  .builds-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap:18px; }
  .build-card {
    background: var(--card); border:1px solid var(--card-border); border-radius:14px; padding:18px;
    box-shadow: var(--shadow); cursor:pointer; transition: transform .15s ease, border-color .15s ease;
    display:flex; flex-direction:column; gap:12px;
  }
  .build-card:hover { transform: translateY(-3px); border-color: rgba(226,188,98,.3); }
  .build-card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .role-tag { display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color: var(--text-dim); }
  .role-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow: 0 0 6px currentColor; }
  .cat-pill {
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px;
    background: rgba(255,255,255,.06); color: var(--text-dim); white-space:nowrap;
  }
  .mini-doll { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; }
  .mini-slot {
    aspect-ratio: 1; background: var(--bg-soft); border:1px solid rgba(255,255,255,.06); border-radius:7px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .mini-slot img { width:100%; height:100%; object-fit:contain; }
  .mini-slot.empty { opacity:.25; }
  .build-card h3 { margin:0; font-size:16px; color: var(--text); }
  .build-card-foot { display:flex; align-items:center; justify-content:space-between; font-size:12px; color: var(--text-dim); }
  .stars { color: var(--gold); letter-spacing:1px; }
  .empty-msg { grid-column: 1/-1; text-align:center; color:var(--text-dim); padding:60px 0; font-size:14px; }

</style>
</head>
<body>
<div id="topbar-root"></div>

<div class="page-wrap">
  <div class="builds-head">
    <div>
      <h1>Biblioteca de builds</h1>
      <p class="subtitle" style="margin:0;">Builds compartilhadas pelos membros das guildas que usam o Empório. Clique numa build para ver itens e habilidades.</p>
    </div>
    <input class="search-box" id="search-input" type="text" placeholder="Buscar build ou autor">
  </div>

  <div class="filters-row" id="role-filters"><span class="filter-group-label">Função</span></div>
  <div class="filters-row" id="cat-filters"><span class="filter-group-label">Conteúdo</span></div>

  <div class="builds-grid" id="builds-grid">
    <div class="empty-msg">Carregando builds...</div>
  </div>
</div>


<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
window.EmporioShell.renderTopbar("/builds/");

const EQUIP_SLOTS = [
  {key:"bag", label:"Bolsa"}, {key:"head", label:"Elmo"}, {key:"cape", label:"Capa"},
  {key:"mainhand", label:"Arma"}, {key:"chest", label:"Peitoral"}, {key:"offhand", label:"Off-Hand"},
  {key:"potion", label:"Poção"}, {key:"shoes", label:"Botas"}, {key:"food", label:"Comida"}, {key:"mount", label:"Montaria"},
];

let ALL_BUILDS = [];
let activeRole = null;
let activeCat = null;

function iconUrl(itemId) {
  return window.EMPORIO_CONFIG.RENDER_BASE + "/" + itemId + ".png?count=1&quality=1";
}

function miniDoll(equip, cls) {
  return EQUIP_SLOTS.map(function (sd) {
    const item = (equip[sd.key] || {}).item;
    if (!item) return '<div class="' + cls + ' empty"></div>';
    return '<div class="' + cls + '" title="' + sd.label + '"><img src="' + iconUrl(item) + '" alt="' + sd.label + '"></div>';
  }).join("");
}

function starStr(avg) {
  if (!avg) return "Sem avaliação";
  const full = Math.round(avg);
  return "★".repeat(full) + "☆".repeat(5 - full) + "  " + avg.toFixed(1);
}

function renderGrid() {
  const grid = document.getElementById("builds-grid");
  const q = (document.getElementById("search-input").value || "").trim().toLowerCase();
  const filtered = ALL_BUILDS.filter(function (b) {
    if (activeRole && b.papel !== activeRole) return false;
    if (activeCat && b.categoria !== activeCat) return false;
    if (q && !(b.nome || "").toLowerCase().includes(q) && !(b.shared_by_name || "").toLowerCase().includes(q)) return false;
    return true;
  });
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-msg">Nenhuma build encontrada com esses filtros.</div>';
    return;
  }
  grid.innerHTML = filtered.map(function (b, idx) {
    const roleDot = b.papel_cor
      ? '<span class="role-dot" style="background:' + b.papel_cor + '; color:' + b.papel_cor + ';"></span>' + (b.papel_label || "")
      : "";
    return (
      '<div class="build-card" data-idx="' + idx + '">' +
      '<div class="build-card-top">' +
      '<div class="role-tag">' + roleDot + '</div>' +
      '<span class="cat-pill">' + (b.categoria || "Sem categoria") + '</span>' +
      '</div>' +
      '<div class="mini-doll">' + miniDoll(b.equip || {}, "mini-slot") + '</div>' +
      '<h3>' + (b.nome || "Build") + '</h3>' +
      '<div class="build-card-foot">' +
      '<span>por ' + (b.shared_by_name || "Anônimo") + '</span>' +
      '<span class="stars">' + starStr(b.avg_rating) + '</span>' +
      '</div>' +
      '</div>'
    );
  }).join("");

  grid.querySelectorAll(".build-card").forEach(function (card) {
    card.addEventListener("click", function () {
      const b = filtered[parseInt(card.dataset.idx, 10)];
      window.location.href = "/builds/" + encodeURIComponent(b.public_id);
    });
  });
}


function buildFilterPills() {
  const roles = {};
  const cats = {};
  ALL_BUILDS.forEach(function (b) {
    if (b.papel) roles[b.papel] = b.papel_label;
    cats[b.categoria || "Sem categoria"] = true;
  });

  const roleWrap = document.getElementById("role-filters");
  Object.keys(roles).forEach(function (rid) {
    const pill = document.createElement("span");
    pill.className = "filter-pill";
    pill.textContent = roles[rid];
    pill.addEventListener("click", function () {
      activeRole = activeRole === rid ? null : rid;
      document.querySelectorAll("#role-filters .filter-pill").forEach(function (p) { p.classList.remove("active"); });
      if (activeRole) pill.classList.add("active");
      renderGrid();
    });
    roleWrap.appendChild(pill);
  });

  const catWrap = document.getElementById("cat-filters");
  Object.keys(cats).forEach(function (cat) {
    const pill = document.createElement("span");
    pill.className = "filter-pill";
    pill.textContent = cat;
    pill.addEventListener("click", function () {
      activeCat = activeCat === cat ? null : cat;
      document.querySelectorAll("#cat-filters .filter-pill").forEach(function (p) { p.classList.remove("active"); });
      if (activeCat) pill.classList.add("active");
      renderGrid();
    });
    catWrap.appendChild(pill);
  });
}

document.getElementById("search-input").addEventListener("input", renderGrid);

fetch(window.EMPORIO_CONFIG.API_BASE + "/api/public/builds")
  .then(function (r) { return r.json(); })
  .then(function (data) {
    ALL_BUILDS = data || [];
    buildFilterPills();
    renderGrid();
  })
  .catch(function () {
    document.getElementById("builds-grid").innerHTML = '<div class="empty-msg">Não foi possível carregar as builds agora. Tente de novo em alguns minutos.</div>';
  });
</script>
</body>
</html>
