<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build | Empório dos Bots</title>
<link rel="stylesheet" href="/assets/css/theme.css?v=20261015b">
<link rel="stylesheet" href="/assets/css/pages.css?v=20261015b">
<style>
  .crumb { color: var(--text-dim); font-size: 13px; margin: 8px 0 22px; }
  .crumb a { color: var(--text-dim); }
  .bd-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; margin-bottom:28px; }
  .bd-head h1 { font-size:36px; margin:6px 0 10px; }
  .bd-meta { display:flex; gap:10px; flex-wrap:wrap; align-items:center; color:var(--text-dim); font-size:13px; }
  .role-tag { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--text); }
  .role-dot { width:10px; height:10px; border-radius:50%; box-shadow:0 0 8px currentColor; }
  .cat-pill { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--text-dim); }
  .rate-box { background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:16px 18px; text-align:center; min-width:200px; }
  .rate-box .big { font-size:28px; font-weight:800; color:var(--gold); }
  .rate-stars { display:flex; gap:4px; justify-content:center; margin-top:8px; }
  .rate-stars button { background:none; border:none; font-size:22px; color:rgba(226,188,98,.35); cursor:pointer; padding:0 2px; }
  .rate-stars button:hover, .rate-stars button.on { color:var(--gold); }
  .bd-layout { display:grid; grid-template-columns: 340px 1fr; gap:26px; align-items:start; }
  .doll { background:var(--card); border:1px solid var(--card-border); border-radius:18px; padding:22px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; box-shadow:var(--shadow); }
  .doll-slot { aspect-ratio:1; background:var(--bg-soft); border:1px solid rgba(255,255,255,.07); border-radius:12px; display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; transition:border-color .15s; }
  .doll-slot:hover, .doll-slot.sel { border-color:var(--gold); }
  .doll-slot img { width:88%; height:88%; object-fit:contain; }
  .doll-slot .lbl { position:absolute; bottom:-1px; left:0; right:0; text-align:center; font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; }
  .doll-slot.empty { opacity:.35; }
  .items-list { display:flex; flex-direction:column; gap:14px; }
  .item-row { background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:16px 18px; display:flex; gap:16px; }
  .item-row.sel { border-color:rgba(226,188,98,.5); }
  .item-row img.ic { width:64px; height:64px; flex-shrink:0; }
  .item-row h3 { margin:0 0 2px; font-size:15.5px; }
  .item-row .slotname { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--gold); font-weight:700; }
  .abil { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .abil-group { display:flex; align-items:center; gap:6px; background:var(--bg-soft); border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:5px 9px 5px 5px; }
  .abil-key { font-size:10.5px; font-weight:800; color:#191305; background:var(--gold); border-radius:5px; padding:2px 6px; }
  .abil-group img { width:26px; height:26px; border-radius:6px; }
  .abil-group span { font-size:12px; color:var(--text-dim); min-width:0; overflow-wrap:anywhere; }
  .abil-group { max-width:100%; flex-wrap:wrap; }
  .item-row > div { min-width:0; }
  .swaps { margin-top:10px; font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .swaps img { width:30px; height:30px; }
  @media (max-width: 860px) { .bd-layout { grid-template-columns: 1fr; } .doll { max-width:360px; } }
</style>
</head>
<body>
<div id="topbar-root"></div>
<main class="page-wrap">
  <div class="crumb"><a href="/builds/">Builds</a> / <span id="crumb-name">Build</span></div>
  <div id="bd-root"><p class="subtitle">Carregando build...</p></div>
</main>
<script src="/assets/js/config.js?v=20261015b"></script>
<script src="/assets/js/auth.js?v=20261015b"></script>
<script src="/assets/js/common.js?v=20261015b"></script>
<script src="/assets/js/shell.js?v=20261015b"></script>
<script>
window.EmporioShell.renderTopbar("/builds/");
const CFG = window.EMPORIO_CONFIG;
const SLOTS = [
  {key:"bag",label:"Bolsa"},{key:"head",label:"Elmo"},{key:"cape",label:"Capa"},
  {key:"mainhand",label:"Arma"},{key:"chest",label:"Peitoral"},{key:"offhand",label:"Off-hand"},
  {key:"potion",label:"Poção"},{key:"shoes",label:"Botas"},{key:"food",label:"Comida"},
];
const MOUNT = {key:"mount",label:"Montaria"};
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function icon(id){ return CFG.RENDER_BASE + "/" + encodeURIComponent(id) + ".png?count=1&quality=1"; }
// Ícones salvos no próprio site. Se faltar algum, tenta o render do Albion.
function spellIcon(id){ return "/assets/img/spells/" + encodeURIComponent(id) + ".webp"; }
function spellFallback(img){
  if (img.dataset.fb) { img.style.visibility = "hidden"; return; }
  img.dataset.fb = "1";
  img.src = "https://render.albiononline.com/v1/spell/" + encodeURIComponent(img.dataset.id) + ".png?size=64";
}
function baseId(id){ return (id||"").replace(/@\d+$/,""); }
function tierLabel(id){ const m=/^T(\d+)_/.exec(id||""); const e=/@(\d+)$/.exec(id||""); return m ? "T"+m[1]+(e?"."+e[1]:"") : ""; }

const pathPart = decodeURIComponent(window.location.pathname.replace(/^\/builds\//,"").replace(/\/$/,""));
const qsId = new URLSearchParams(location.search).get("id");
const publicId = qsId || pathPart;

Promise.all([
  fetch(CFG.API_BASE + "/api/public/builds").then(function(r){return r.json();}),
  fetch("/assets/data/itens.json").then(function(r){return r.json();}).catch(function(){return {items:{},spells:{}};}),
]).then(function(res){
  const b = (res[0]||[]).find(function(x){ return x.public_id === publicId; });
  const DB = res[1];
  if (!b) { document.getElementById("bd-root").innerHTML = '<p class="subtitle">Essa build não está mais pública. <a href="/builds/">Voltar para a biblioteca</a></p>'; return; }
  render(b, DB);
}).catch(function(){
  document.getElementById("bd-root").innerHTML = '<p class="subtitle">Não foi possível carregar a build agora. Tente de novo em alguns minutos.</p>';
});

function avalTxt(n){ n = n||0; return n === 0 ? "Nenhuma avaliação" : n === 1 ? "1 avaliação" : n + " avaliações"; }
function itemName(DB,id){ const it = DB.items[baseId(id)]; return it ? it.n : id; }

function abilitiesHtml(DB,id){
  const it = DB.items[baseId(id)];
  if (!it || !it.g) return "";
  const order = ["Q","W","E","R","D","F","A","P1","P2","P3"];
  const keys = Object.keys(it.g).sort(function(a,b){ return order.indexOf(a)-order.indexOf(b); });
  return '<div class="abil">' + keys.map(function(k){
    // O render do Albion espera o nome interno da habilidade (a chave do
    // catálogo), não o nome do sprite. Com o sprite, a maioria dava 404.
    const opts = it.g[k].map(function(sid){ const s = DB.spells[sid]; return {id:sid, n: s ? s.n : sid}; });
    return '<div class="abil-group"><span class="abil-key">'+esc(k)+'</span>' + opts.map(function(s){
      return '<img src="'+spellIcon(s.id)+'" data-id="'+esc(s.id)+'" alt="'+esc(s.n)+'" title="'+esc(s.n)+'" loading="lazy" onerror="spellFallback(this)">';
    }).join("") + '<span>' + esc(opts.map(function(s){return s.n;}).join(" / ")) + '</span></div>';
  }).join("") + '</div>';
}

function render(b, DB){
  document.title = (b.nome||"Build") + " | Empório dos Bots";
  document.getElementById("crumb-name").textContent = b.nome || "Build";
  const eq = b.equip || {};
  const role = b.papel_cor ? '<span class="role-tag"><span class="role-dot" style="background:'+b.papel_cor+';color:'+b.papel_cor+'"></span>'+esc(b.papel_label)+'</span>' : '';
  const dollSlots = SLOTS.concat([MOUNT]).map(function(sd){
    const it = (eq[sd.key]||{}).item;
    const style = sd.key==="mount" ? ' style="grid-column:2"' : '';
    if (!it) return '<div class="doll-slot empty"'+style+'><span class="lbl">'+sd.label+'</span></div>';
    return '<div class="doll-slot" data-slot="'+sd.key+'"'+style+' title="'+esc(itemName(DB,it))+'"><img src="'+icon(it)+'" alt=""><span class="lbl">'+sd.label+'</span></div>';
  }).join("");
  const rows = SLOTS.concat([MOUNT]).filter(function(sd){ return (eq[sd.key]||{}).item; }).map(function(sd){
    const s = eq[sd.key]; const id = s.item;
    const swaps = (s.swaps||[]).length ? '<div class="swaps">Swaps: ' + s.swaps.map(function(w){ return '<img src="'+icon(w)+'" title="'+esc(itemName(DB,w))+'" alt="">'; }).join("") + '</div>' : '';
    return '<div class="item-row" id="row-'+sd.key+'"><img class="ic" src="'+icon(id)+'" alt=""><div style="min-width:0">' +
      '<div class="slotname">'+sd.label+' · '+tierLabel(id)+'</div><h3>'+esc(itemName(DB,id))+'</h3>' + abilitiesHtml(DB,id) + swaps + '</div></div>';
  }).join("");
  document.getElementById("bd-root").innerHTML =
    '<div class="bd-head"><div>' + role +
    '<h1>'+esc(b.nome||"Build")+'</h1><div class="bd-meta"><span class="cat-pill">'+esc(b.categoria||"Sem categoria")+'</span><span>por <b style="color:var(--text)">'+esc(b.shared_by_name||"Anônimo")+'</b></span></div></div>' +
    '<div class="rate-box"><div class="big" id="avg">'+(b.avg_rating ? b.avg_rating.toFixed(1) : "0.0")+'</div>' +
    '<div style="font-size:12px;color:var(--text-dim)" id="cnt">'+avalTxt(b.rating_count)+'</div>' +
    '<div class="rate-stars" id="stars">'+[1,2,3,4,5].map(function(n){return '<button data-n="'+n+'" title="'+n+' estrela(s)">★</button>';}).join("")+'</div>' +
    '<div style="font-size:11.5px;color:var(--text-dim);margin-top:6px" id="rate-msg">Clique para dar sua nota</div></div></div>' +
    '<div class="bd-layout"><div class="doll">'+dollSlots+'</div><div class="items-list">'+(rows||'<p class="subtitle">Nenhum item equipado.</p>')+'</div></div>';

  document.querySelectorAll(".doll-slot[data-slot]").forEach(function(el){
    el.addEventListener("click", function(){
      document.querySelectorAll(".doll-slot, .item-row").forEach(function(x){x.classList.remove("sel");});
      el.classList.add("sel");
      const row = document.getElementById("row-"+el.dataset.slot);
      if (row) { row.classList.add("sel"); row.scrollIntoView({behavior:"smooth", block:"center"}); }
    });
  });
  document.querySelectorAll("#stars button").forEach(function(btn){
    btn.addEventListener("click", async function(){
      const msg = document.getElementById("rate-msg");
      if (!window.EmporioAuth.getToken()) { msg.innerHTML = '<a href="/login/">Entre</a> para avaliar'; return; }
      const n = parseInt(btn.dataset.n,10);
      try {
        const r = await window.EmporioAuth.apiFetch("/api/public/builds/"+encodeURIComponent(b.public_id)+"/rate", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({stars:n})});
        if (!r.ok) throw new Error();
        const d = await r.json();
        document.getElementById("avg").textContent = d.avg_rating.toFixed(1);
        document.getElementById("cnt").textContent = avalTxt(d.rating_count);
        document.querySelectorAll("#stars button").forEach(function(x){ x.classList.toggle("on", parseInt(x.dataset.n,10) <= n); });
        msg.textContent = "Nota salva.";
      } catch(e) { msg.textContent = "Não foi possível salvar a nota."; }
    });
  });
}
</script>
</body>
</html>
