<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ferramentas | Empório dos Bots</title>
<meta name="description" content="Todas as ferramentas do Empório dos Bots para Albion Online.">
<link rel="stylesheet" href="/assets/css/theme.css?v=20261016c">
<link rel="stylesheet" href="/assets/css/pages.css?v=20261016c">
</head>
<body>
<div id="topbar-root"></div>
<main class="page-wrap">
  <section class="page-hero">
    <div class="eyebrow">Ferramentas</div>
    <h1>Todas as ferramentas</h1>
    <p class="subtitle">Tudo o que o site oferece, separado do mesmo jeito que no menu.</p>
  </section>
  <div id="groups"></div>
</main>
<script src="/assets/js/config.js?v=20261016c"></script>
<script src="/assets/js/auth.js?v=20261016c"></script>
<script src="/assets/js/common.js?v=20261016c"></script>
<script src="/assets/js/shell.js?v=20261016c"></script>
<script>
EmporioShell.renderTopbar("/ferramentas/");
document.getElementById("groups").innerHTML = EmporioShell.MENU.map(function (g) {
  return '<div class="section"><h2>' + g.label + '</h2><div class="feature-grid">' + g.items.map(function (i) {
    return '<a class="feature-card" href="' + i.href + '"><h3>' + i.label + "</h3><p>" + i.desc + "</p></a>";
  }).join("") + "</div></div>";
}).join("");
</script>
</body>
</html>
