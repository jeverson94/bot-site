<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batalhas | Empório dos Bots</title>
<meta name="description" content="Batalhas recentes de Albion Online por servidor, com guildas, abates e fama.">
<link rel="stylesheet" href="/assets/css/theme.css?v=20261016d">
<link rel="stylesheet" href="/assets/css/pages.css?v=20261016d">
<style>
  .bt-guilds { font-weight: 600; color: var(--text); max-width: 560px; }
  .bt-guilds small { display: block; font-weight: 400; color: var(--text-dim); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<div id="topbar-root"></div>
<main class="page-wrap">
  <section class="page-hero">
    <div class="eyebrow">Batalhas</div>
    <h1>Batalhas recentes</h1>
    <p class="subtitle">Lutas registradas pela API oficial do Albion. O site guarda as batalhas assim que elas aparecem na API, que publica com alguns minutos de atraso.</p>
  </section>

  <div class="toolbar">
    <div id="region"></div>
    <div class="row wrap" id="sizes"></div>
    <input class="input grow" id="q" type="search" placeholder="Filtrar por guilda ou aliança" style="max-width:300px">
  </div>

  <p class="muted small" id="upd"></p>
  <div class="table-wrap">
    <table class="table">
      <thead><tr><th>Guildas</th><th>Quando</th><th class="num">Jogadores</th><th class="num">Abates</th><th class="num">Fama</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="state"></div>
  <div class="pager"><button class="btn secondary" id="more" style="display:none">Carregar mais</button></div>
</main>
<script src="/assets/js/config.js?v=20261016d"></script>
<script src="/assets/js/auth.js?v=20261016d"></script>
<script src="/assets/js/common.js?v=20261016d"></script>
<script src="/assets/js/shell.js?v=20261016d"></script>
<script>
EmporioShell.renderTopbar("/batalhas/");

const SIZES = [0, 10, 20, 50, 100];
let region = Emp.getRegion();
let minPlayers = 0;
let offset = 0;
let fromDb = null;
let qTimer = null;
let all = [];
let busy = false;

function topSides(b) {
  if (b.sides) return b.sides;
  // Agrupa por aliança (ou guilda, quando não há aliança) e ordena por jogadores.
  const sides = {};
  Object.values(b.players || {}).forEach(function (p) {
    const key = p.allianceName || p.guildName;
    if (!key) return;
    if (!sides[key]) sides[key] = { n: key, p: 0, guilds: {} };
    sides[key].p++;
    if (p.guildName) sides[key].guilds[p.guildName] = 1;
  });
  return Object.values(sides).sort(function (a, c) { return c.p - a.p; });
}

function count(b) { return b.n != null ? b.n : Object.keys(b.players || {}).length; }
function matches(b) {
  if (fromDb) return true;
  const n = count(b);
  if (n < minPlayers) return false;
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (!q) return true;
  return Object.values(b.players || {}).some(function (p) {
    return (p.guildName || "").toLowerCase().includes(q) || (p.allianceName || "").toLowerCase().includes(q);
  });
}

// O Albion corta uma luta longa em várias batalhas. Junta as que começaram até 10 min
// uma da outra e têm um dos dois lados principais (os com mais jogadores) em comum.
function agrupar(list) {
  const grupos = [];
  list.forEach(function (b) {
    const t = Date.parse(b.startTime);
    const principais = function (x) { return topSides(x).slice(0, 2).map(function (y) { return y.n; }); };
    const meus = principais(b);
    const g = grupos.find(function (g) {
      return g.bs.some(function (m) { return Math.abs(Date.parse(m.startTime) - t) <= 600000 && principais(m).some(function (n) { return meus.indexOf(n) >= 0; }); });
    });
    if (g) g.bs.push(b); else grupos.push({ bs: [b] });
  });
  return grupos;
}
function hm(iso) { return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }

function render() {
  const list = all.filter(matches);
  document.getElementById("rows").innerHTML = agrupar(list).map(function (g) {
    const bs = g.bs.slice().sort(function (a, c) { return Date.parse(a.startTime) - Date.parse(c.startTime); });
    const b = bs[0];
    const ladosMap = {};
    bs.forEach(function (x) { topSides(x).forEach(function (s) { if (!ladosMap[s.n] || ladosMap[s.n].p < s.p) ladosMap[s.n] = { n: s.n, p: s.p }; }); });
    const sides = Object.values(ladosMap).sort(function (a, c) { return c.p - a.p; });
    const names = sides.slice(0, 4).map(function (s) { return Emp.esc(s.n) + " (" + s.p + ")"; }).join(", ");
    const extra = sides.length > 4 ? " e mais " + (sides.length - 4) : "";
    const varias = bs.length > 1;
    const kills = bs.reduce(function (n, x) { return n + (x.totalKills || 0); }, 0);
    const fama = bs.reduce(function (n, x) { return n + (x.totalFame || 0); }, 0);
    const jog = Math.max.apply(null, bs.map(count));
    return '<tr class="link" data-id="' + b.id + '"><td class="bt-guilds">' + (names || "Jogadores sem guilda") + extra +
      "<small>" + sides.length + (sides.length === 1 ? " lado" : " lados") + (varias ? ' · <span style="color:var(--gold)">luta com ' + bs.length + " batalhas (" + bs.map(function (x) { return hm(x.startTime); }).join(", ") + ")</span>" : "") + "</small></td>" +
      '<td class="muted small">' + Emp.ago(b.startTime) + "<br>" + Emp.dateTime(b.startTime) + "</td>" +
      '<td class="num"' + (varias ? ' title="Maior batalha da luta"' : "") + ">" + jog + '</td><td class="num">' + Emp.int(kills) +
      '</td><td class="num">' + Emp.num(fama) + "</td></tr>";
  }).join("");
  const st = document.getElementById("state");
  if (!list.length && !busy) st.innerHTML = Emp.emptyState("Nenhuma batalha com esses filtros nas páginas carregadas. Tente carregar mais.");
  else if (!busy) st.innerHTML = "";
}

async function loadPage(auto) {
  if (busy) return;
  busy = true;
  document.getElementById("state").innerHTML = Emp.loading("Buscando batalhas...");
  document.getElementById("more").style.display = "none";
  try {
    // Primeiro tenta o banco do site (resposta imediata, já filtrada); se ainda estiver vazio, usa a API oficial.
    if (fromDb !== false) {
      const d = await Emp.albion("lista", { s: region, offset: offset, min: Math.max(5, minPlayers), q: document.getElementById("q").value.trim() });
      if (d.total > 0) {
        fromDb = true;
        offset += 50;
        d.battles.forEach(function (b) { if (!all.some(function (x) { return x.id === b.id; })) all.push(b); });
        document.getElementById("upd").innerHTML = '<span class="live-dot"></span>Atualizado ' + Emp.ago(d.updated * 1000) + ". Lutas com 5 ou mais jogadores.";
        busy = false;
        if (pending) { pending = false; reset(); return; }
        render();
        document.getElementById("more").style.display = d.battles.length < 50 ? "none" : "";
        return;
      }
      fromDb = false;
    }
    // Com filtro de tamanho, busca algumas páginas seguidas até ter resultado suficiente.
    let tries = 0;
    do {
      const page = await Emp.albion("battles", { s: region, offset: offset, limit: 50, sort: "recent" });
      offset += 50;
      page.forEach(function (b) { if (!all.some(function (x) { return x.id === b.id; })) all.push(b); });
      tries++;
    } while (auto && all.filter(matches).length < 20 && tries < 6 && offset < 2000);
    busy = false;
    render();
    document.getElementById("more").style.display = "";
  } catch (e) {
    busy = false;
    document.getElementById("state").innerHTML = Emp.emptyState(Emp.esc(e.message) + ". Tente de novo em alguns minutos.");
    document.getElementById("more").style.display = "";
  }
}

let pending = false;
function reset() {
  if (busy) { pending = true; return; }
  offset = 0; all = [];
  document.getElementById("rows").innerHTML = "";
  loadPage(true);
}

Emp.regionTabs(document.getElementById("region"), function (r) { region = r; fromDb = null; reset(); });

document.getElementById("sizes").innerHTML = SIZES.map(function (n) {
  return '<span class="chip' + (n === 0 ? " on" : "") + '" data-n="' + n + '">' + (n ? n + "+ jogadores" : "Todas") + "</span>";
}).join("");
document.getElementById("sizes").addEventListener("click", function (e) {
  const c = e.target.closest("[data-n]");
  if (!c) return;
  minPlayers = parseInt(c.dataset.n, 10);
  document.querySelectorAll("#sizes .chip").forEach(function (x) { x.classList.toggle("on", x === c); });
  if (fromDb) { reset(); return; }
  render();
  if (all.filter(matches).length < 20) loadPage(true);
});
document.getElementById("q").addEventListener("input", function () {
  if (!fromDb) { render(); return; }
  clearTimeout(qTimer); qTimer = setTimeout(reset, 350);
});
document.getElementById("more").addEventListener("click", function () { loadPage(true); });
document.getElementById("rows").addEventListener("click", function (e) {
  const tr = e.target.closest("tr[data-id]");
  if (tr) location.href = "/batalhas/" + tr.dataset.id + "?s=" + region;
});

reset();
</script>
</body>
</html>
