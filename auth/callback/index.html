<script src="/assets/js/config.js?v=20261015f"></script>
<script src="/assets/js/auth.js?v=20261015f"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  if (token) {
    window.EmporioAuth.setToken(token);
    window.location.href = "/";
  } else {
    window.location.href = "/login/?erro=oauth_falhou";
  }
</script>
